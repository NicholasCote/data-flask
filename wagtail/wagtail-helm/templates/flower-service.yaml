apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.webapp.name }}-flower
  labels:
    app: {{ .Values.webapp.name }}-flower
    component: flower
spec:
  selector:
    app: {{ .Values.webapp.name }}-flower
  ports:
    - name: http
      protocol: TCP
      port: 5555
      targetPort: 5555
    - name: metrics
      port: 9091
      targetPort: 5555