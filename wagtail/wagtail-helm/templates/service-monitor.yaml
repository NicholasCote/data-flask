apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.webapp.name }}-web-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
      component: web
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.webapp.name }}-worker-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.webapp.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
      component: worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.webapp.name }}-flower-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.webapp.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
      component: flower
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s