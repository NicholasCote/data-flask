# templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.webapp.name }}-celery-alerts
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.webapp.name }}
spec:
  groups:
    - name: celery.rules
      rules:
        - alert: CeleryTaskStarted
          expr: increase(celery_task_started_total[5m]) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Celery task started: {{ $labels.task_name }}"
            description: "{{ $value }} task(s) started in the last 5 minutes."

        - alert: CeleryTaskFailed
          expr: increase(celery_task_failed_total[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Celery task failed: {{ $labels.task_name }}"
            description: "Exception: {{ $labels.exception }}, {{ $value }} failure(s) in last 5m."

        - alert: CeleryTaskHighDuration
          expr: histogram_quantile(0.95, rate(celery_task_duration_seconds_bucket[5m])) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Slow Celery task: {{ $labels.task_name }}"
            description: "P95 duration is {{ $value }}s (threshold: 30s)."

        - alert: CeleryNoActiveWorkers
          expr: celery_workers_active == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No active Celery workers"
            description: "Worker gauge has been 0 for 2 minutes."