apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: test-email-routing
  namespace: ncote
  labels:
    alertmanagerConfig: test
    namespace: ncote
spec:
  route:
    receiver: ncote-test
    groupBy:
      - alertname
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 5m 
    matchers:
      - name: namespace
        value: ncote
        matchType: "="

  receivers:
    - name: ncote-test
      emailConfigs:
        - to: ncote@ucar.edu 
          from: alertmanager@k8s.ucar.edu
          smarthost: vdir.ucar.edu:25  