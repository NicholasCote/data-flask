apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ncote-test
  namespace: ncote
  labels:
    team: ncote-test
    release: kube-prometheus-stack
    severity: warning
spec:
  groups:
  - name: ncote-test
    interval: 30s
    rules:
    - alert: TestAlertAlwaysFiring
      expr: vector(1)  # This always returns 1, so alert always fires
      for: 1m
      labels:
        severity: warning
        team: ncote-test
      annotations:
        summary: "Test alert - always firing"
        description: "This is a test alert to verify email routing works"