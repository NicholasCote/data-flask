name: Flask DB CICD Pipeline

on:
  push:
    paths:
      - flask-db/Dockerfile
      - flask-db/requirements.txt
      - flask-db/app/**
    branches:
      - dev

jobs:
  container-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dev
      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT
      - name: Build and push image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: flask-db/.
          file: flask-db/Dockerfile
          push: true
          tags: ncote/flask-db-demo:${{ steps.date.outputs.date }}
      - name: Update values.yaml with new image tag
        run: |
          sed -i 's|image: docker.io/ncote/flask-db-demo:.*|image: docker.io/ncote/flask-db-demo:${{ steps.date.outputs.date }}|' flask-db/postgres-helm/values.yaml
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add flask-db/postgres-helm/values.yaml
          git commit -m "Update flask-db image tag to ${{ steps.date.outputs.date }}"
          git push origin dev
