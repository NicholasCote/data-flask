# Package: one per dataset. Points at that dataset's immutable release-asset
# zip (just its function module -- the gdex_point lib is baked into the shared
# environment image, so the zip stays tiny). Because deps live in the image,
# the zip IS the deployment archive -- no in-cluster build, so buildstatus is
# "none". Splitting packages per dataset means a change to one dataset only
# re-specializes that dataset's function, not every function in the repo.
apiVersion: fission.io/v1
kind: Package
metadata:
  name: na-cordex
  namespace: ncote
spec:
  environment:
    # Shared runtime image across all datasets.
    name: gdex-point
    namespace: ncote
  deployment:
    type: url
    # Both pinned by CI on each release. Release assets are immutable blobs;
    # do NOT point at github.com/<org>/<repo>/archive/... auto-generated zips,
    # which are not byte-stable and will break the checksum.
    url: https://github.com/NicholasCote/fission-workloads/releases/download/dev/gdex-point-na-cordex-dev-a1f782a.zip
    checksum:
      type: sha256
      sum: "090eba2fd61911b0bdac795a698fd48d8ca0406a374c9a6a2213904629cbef84"
status:
  # Load-bearing: the executor only specializes packages whose buildstatus is
  # none or succeeded. The CLI sets this for source-less packages; in GitOps
  # we set it ourselves.
  buildstatus: none
