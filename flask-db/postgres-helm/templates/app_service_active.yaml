apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.webapp.name }}-active
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.webapp.name }}
  ports:
  - port: {{ .Values.webapp.container.port }}
    targetPort: {{ .Values.webapp.container.port }}